<script>
/* Deployment configuration. These are the only values a clinic
   should need to change, and they are set here rather than buried
   in the application so that changing them needs no knowledge of
   the code.

   nurseCode is a SPEED BUMP, NOT SECURITY. The whole application
   runs in the browser, so anyone who views the page source can
   read this string. It exists to stop a patient wandering into
   the nursing tab by accident, nothing more. Never set it to a
   password used anywhere else. */
window.DMPC_CONFIG = {
  nurseCode: '{{NURSE_CODE}}',
  notebookUrl: '{{NOTEBOOK_URL}}',
  version: '{{VERSION}}'
};
</script>
