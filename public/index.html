<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="color-scheme" content="light"/>
<meta name="theme-color" content="#0d7d76"/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="description" content="Borang pra-konsultasi untuk Klinik Diabetik. Diisi oleh pesakit sementara menunggu. Kandungan klinikal berasaskan CPG Diabetes Mellitus Jenis 2 (Edisi ke-6, 2020) dan CPG Pengurusan Obesiti (Edisi ke-2, 2023), Kementerian Kesihatan Malaysia."/>
<title>Pra-Konsultasi Klinik Diabetik</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a7c82'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-weight='bold'%3ED%3C/text%3E%3C/svg%3E"/>
<style>
/* ============================================================
   PRA-KONSULTASI DIABETIK — DESIGN SYSTEM

   Styled to match the Family Cancer Risk Check prototype
   (Dr Nurul Amiera Asli, IKN), so that a patient meeting both
   Malaysian health tools meets one visual language rather than
   two. What that borrows, specifically:

     - a warm cream-to-cool-blue page wash rather than flat grey,
       which is what stops a long clinical form reading as a form;
     - teal #0d7d76 as the single brand hue, used for the hero,
       the eyebrows and the primary action, and never as a data
       encoding;
     - a persistent red symptom strip pinned under the header, so
       the way out is on screen at every moment, not buried in
       whichever section happens to ask about chest pain;
     - a dark teal hero card carrying one instruction and one
       white pill button;
     - generous radii (14-24px), soft low-contrast shadows, and
       white cards floating on the wash;
     - small uppercase teal eyebrows above every section heading;
     - answers as full-width cards with a circled letter.

   WHO IT IS DRAWN FOR
     A patient in their fifties or sixties, on their own phone, in
     a bright waiting area, possibly with diabetic retinopathy or
     presbyopia, possibly reading Malay after a regional first
     language. That forces 17px base text, a 48px minimum target
     because a fingertip numbed by diabetic neuropathy is a real
     input device, and one question per block.

   DELIBERATELY SCROLLING
     The sibling screens in this hospital's estate never scroll,
     because they are fixed wall displays. This is the opposite
     case: a long form in someone's hand.
   ============================================================ */

:root {
  color-scheme: light;

  /* Brand */
  --teal:      #0d7d76;
  --teal-dk:   #0a5f5a;
  --teal-dpst: #0c6b64;
  --teal-lt:   #d9eeea;
  --teal-pale: #eef6f4;

  /* Ink */
  --ink:    #10221f;
  --ink-2:  #566b67;
  --ink-3:  #8295914;
  --ink-3:  #829591;

  /* Surfaces */
  --surface:   #ffffff;
  --surface-2: #f4f8f7;
  --line:      #e3eae8;
  --line-2:    #d3dedb;

  /* Status. Each ships with a word or an icon as well as a hue;
     nothing here is encoded by colour alone. */
  --ok:      #0b7a3b;
  --ok-lt:   #e4f6ea;
  --amber:   #f5a623;
  --amber-ink: #7a4f00;
  --amber-lt:  #fdf6e3;
  --amber-ln:  #ecd8a6;
  --red:     #b32626;
  --red-ink: #8e1f1f;
  --red-lt:  #fdeaea;
  --red-ln:  #f2c9c9;

  /* Glucose bands — chart and logbook rows */
  --glu-in:  #0b7a3b;
  --glu-hi:  #b06a00;
  --glu-lo1: #c0392b;
  --glu-lo2: #8a1420;

  --r-sm: 10px;
  --r:    16px;
  --r-lg: 22px;
  --r-xl: 26px;

  --shadow:    0 1px 2px rgba(16,34,31,.04), 0 6px 20px rgba(13,125,118,.07);
  --shadow-lg: 0 2px 6px rgba(16,34,31,.05), 0 18px 46px rgba(13,125,118,.12);

  --tap: 48px;
  --wrap: 760px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }

html { -webkit-text-size-adjust: 100%; height: 100% }

body {
  font-family: Figtree, 'Plus Jakarta Sans', system-ui, -apple-system,
               'Segoe UI', Roboto, sans-serif;
  font-size: 17px;
  line-height: 1.5;
  color: var(--ink);
  min-height: 100%;
  overflow-wrap: break-word;
  /* The wash. Fixed so it does not slide as a long section
     scrolls, and pinned behind a matching base colour so the
     bottom of a very long page never shows white. */
  background: #eef3f1;
  background-image:
    linear-gradient(135deg, #fdf5e6 0%, #f2f6f2 42%, #e9eef7 100%);
  background-attachment: fixed;
}

.mono { font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace }

:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; border-radius: 6px }

/* ── HEADER ──────────────────────────────────────────────── */
.hdr {
  padding: 14px max(16px, env(safe-area-inset-left)) 0 max(16px, env(safe-area-inset-right));
}
.hdr-row {
  display: flex; align-items: center; gap: 12px;
  max-width: var(--wrap); margin: 0 auto;
}
.hdr-ic {
  flex: none; width: 46px; height: 46px; border-radius: 13px;
  background: linear-gradient(145deg, var(--teal), var(--teal-dk));
  display: grid; place-items: center; font-size: 24px;
  box-shadow: 0 4px 12px rgba(13,125,118,.25);
}
.hdr-id { flex: 1; min-width: 0 }
.hdr-id h1 {
  font-size: 18px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2;
  /* body breaks long words so a patient's answer cannot widen the
     page; the title is not patient input and must never be split
     mid-word -- "Pra-Konsul / tasi" is not a word. */
  overflow-wrap: normal; word-break: normal; hyphens: none;
}
.hdr-id p {
  font-size: 12.5px; color: var(--ink-3); font-weight: 600; margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Language as a segmented control. One button, two halves: the
   whole control toggles, so there is no wrong half to hit. */
.lang {
  flex: none; display: flex; padding: 3px; gap: 2px; cursor: pointer;
  background: rgba(255,255,255,.75); border: 1px solid var(--line);
  border-radius: 999px; font: inherit; min-height: 42px;
  box-shadow: 0 1px 2px rgba(16,34,31,.04);
}
.lang-seg {
  display: grid; place-items: center; min-width: 42px; padding: 0 12px;
  font-size: 13px; font-weight: 800; color: var(--ink-3);
  border-radius: 999px; letter-spacing: .02em;
}
.lang-seg.on { background: var(--teal); color: #fff }

#saveChip {
  font-size: 12px; font-weight: 800; color: var(--teal);
  opacity: 0; transition: opacity .25s; white-space: nowrap;
}
#saveChip.on { opacity: 1 }

.hdr-btn {
  font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
  min-height: 44px; padding: 10px 16px; white-space: nowrap;
  border: 1px solid var(--line); background: rgba(255,255,255,.75);
  color: var(--ink-2); border-radius: 999px;
}
.hdr-btn:hover { background: #fff; color: var(--red); border-color: var(--red-ln) }

/* Progress */
#progress { max-width: var(--wrap); margin: 12px auto 0 }
.prog-track { height: 6px; background: rgba(16,34,31,.09); border-radius: 999px; overflow: hidden }
.prog-fill { height: 100%; background: var(--teal); border-radius: 999px; transition: width .35s ease }
#progTxt { font-size: 11.5px; font-weight: 700; color: var(--ink-3); margin-top: 4px; display: block }

/* ── SYMPTOM STRIP ───────────────────────────────────────
   Pinned under the header on every tab. The one thing a
   waiting-room form must never bury. */
.sos-wrap { padding: 12px max(16px, env(safe-area-inset-left)) 0; }
.sos {
  display: flex; align-items: center; gap: 12px; width: 100%;
  max-width: var(--wrap); margin: 0 auto; cursor: pointer;
  font: inherit; text-align: left;
  background: var(--red-lt); border: 1.5px solid var(--red-ln);
  border-radius: var(--r); padding: 13px 16px; min-height: 56px;
  color: var(--red-ink);
}
.sos:hover { background: #fce0e0 }
.sos-ic { font-size: 21px; flex: none; line-height: 1 }
.sos-t { flex: 1; font-size: 15.5px; font-weight: 800; line-height: 1.3 }
.sos-go { font-size: 14.5px; font-weight: 800; white-space: nowrap }

.sos-panel {
  max-width: var(--wrap); margin: 10px auto 0;
  background: var(--surface); border: 1.5px solid var(--red-ln);
  border-left: 5px solid var(--red); border-radius: var(--r);
  padding: 18px; box-shadow: var(--shadow);
}
.sos-panel h3 { font-size: 17px; font-weight: 800; color: var(--red-ink); margin-bottom: 8px }
.sos-panel p { font-size: 15px; color: var(--ink-2); margin-bottom: 10px }
.sos-list { list-style: none; margin: 12px 0 }
.sos-list li {
  font-size: 15.5px; font-weight: 600; padding: 9px 0 9px 26px;
  position: relative; border-top: 1px solid var(--line);
}
.sos-list li::before {
  content: '\2022'; position: absolute; left: 8px; top: 8px;
  color: var(--red); font-weight: 800; font-size: 19px; line-height: 1;
}
.sos-call {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--red-lt); border-radius: var(--r-sm);
  padding: 12px 14px; font-size: 15px; font-weight: 700; color: var(--red-ink);
}
.sos-call b { font-size: 22px }

/* ── TABS ────────────────────────────────────────────────── */
.tabs {
  display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none;
  max-width: var(--wrap); margin: 14px auto 0;
  padding: 0 max(16px, env(safe-area-inset-left)) 2px;
  -webkit-overflow-scrolling: touch;
}
.tabs::-webkit-scrollbar { display: none }
.tab {
  font: inherit; cursor: pointer; text-align: left; flex: none;
  min-height: 44px; padding: 7px 15px; border-radius: 999px;
  border: 1px solid var(--line); background: rgba(255,255,255,.8);
  color: var(--ink-2); display: flex; flex-direction: column; justify-content: center;
}
.tab:hover { background: #fff; border-color: var(--line-2) }
.tab-t { font-size: 14px; font-weight: 800; white-space: nowrap }
.tab-h { font-size: 10px; font-weight: 600; color: var(--ink-3); white-space: nowrap }
.tab.on { background: var(--teal); border-color: var(--teal); color: #fff;
          box-shadow: 0 3px 10px rgba(13,125,118,.24) }
.tab.on .tab-h { color: rgba(255,255,255,.82) }

/* ── SHELL ───────────────────────────────────────────────── */
.wrap {
  max-width: var(--wrap); margin: 0 auto;
  padding: 16px max(16px, env(safe-area-inset-left)) 60px max(16px, env(safe-area-inset-right));
}

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--shadow);
  padding: 22px; margin-bottom: 16px;
}
.card h2 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; line-height: 1.25; margin-bottom: 10px }
.card h3 {
  font-size: 16px; font-weight: 800; color: var(--ink);
  margin: 22px 0 10px; padding-top: 18px; border-top: 1px solid var(--line);
}
.card h3:first-of-type { border-top: 0; padding-top: 0; margin-top: 4px }
.card p { margin-bottom: 11px; color: var(--ink-2) }
.card p.big { font-size: 18px; color: var(--ink) }
.card p.time { font-weight: 700; color: var(--teal) }

/* The small uppercase teal label above a heading. */
.eyebrow {
  font-size: 11.5px; font-weight: 800; color: var(--teal);
  text-transform: uppercase; letter-spacing: .1em; margin-bottom: 7px;
}

.row-between { display: flex; align-items: flex-start; gap: 12px; justify-content: space-between; flex-wrap: wrap }

ul.plain { list-style: none; margin: 0 0 12px }
ul.plain li {
  position: relative; padding: 10px 0 10px 26px;
  color: var(--ink-2); border-bottom: 1px solid var(--line);
}
ul.plain li::before {
  content: '\2022'; position: absolute; left: 8px; top: 9px;
  color: var(--teal); font-weight: 800; font-size: 19px; line-height: 1;
}
ul.plain li:last-child { border-bottom: 0 }

.pdpa { font-size: 13.5px; color: var(--ink-3); font-style: italic }
.ref { font-size: 14.5px; color: var(--ink-2) }

.warnbox {
  background: var(--amber-lt); border: 1px solid var(--amber-ln);
  border-left: 4px solid var(--amber);
  border-radius: var(--r-sm); padding: 13px 15px;
  font-size: 14.5px; color: var(--amber-ink); margin-bottom: 13px;
}
.warnbox.is-hard {
  background: var(--red-lt); border-color: var(--red-ln);
  border-left-color: var(--red); color: var(--red-ink); font-weight: 700;
}

/* ── HERO ────────────────────────────────────────────────── */
.hero {
  background: linear-gradient(150deg, var(--teal-dpst) 0%, var(--teal-dk) 100%);
  border-radius: var(--r-xl); padding: 26px 24px 24px;
  color: #fff; margin-bottom: 16px;
  box-shadow: 0 10px 34px rgba(10,95,90,.26);
}
.hero .eyebrow { color: rgba(255,255,255,.72) }
.hero h2 {
  font-size: 28px; font-weight: 800; letter-spacing: -.03em;
  line-height: 1.18; margin-bottom: 12px; color: #fff;
}
.hero p { font-size: 16.5px; color: rgba(255,255,255,.9); margin-bottom: 8px }
.hero .hero-time { font-size: 14.5px; color: rgba(255,255,255,.75); font-weight: 600 }
.btn-hero {
  width: 100%; margin-top: 18px; background: #fff; color: var(--teal-dk);
  border: 0; font-size: 18px; font-weight: 800; min-height: 60px;
  border-radius: var(--r); cursor: pointer; font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-hero:hover { background: #f2fbfa }

/* 2 x 2 card grid */
.grid-cards {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(152px, 1fr));
  gap: 12px; margin-bottom: 16px;
}
.gcard {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 18px; cursor: pointer;
  font: inherit; text-align: left; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 3px; min-height: 112px;
}
.gcard:hover { border-color: var(--teal); box-shadow: var(--shadow-lg) }
.gcard-ic { font-size: 24px; line-height: 1; margin-bottom: 4px }
.gcard-t { font-size: 15.5px; font-weight: 800; color: var(--ink) }
.gcard-d { font-size: 13px; color: var(--ink-3); line-height: 1.4 }

.notebox {
  background: var(--amber-lt); border: 1px solid var(--amber-ln);
  border-radius: var(--r-sm); padding: 14px 16px;
  font-size: 14.5px; color: var(--amber-ink); margin-bottom: 12px;
}
.infobox {
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 14px 16px;
  font-size: 14px; color: var(--ink-2);
}

/* Bordered sub-cards inside a section (the "why use this" list) */
.feat { display: flex; flex-direction: column; gap: 11px }
.feat-item {
  display: flex; gap: 14px; align-items: flex-start;
  border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px 17px; background: var(--surface);
}
.feat-ic { font-size: 21px; line-height: 1.2; flex: none }
.feat-t { font-size: 16px; font-weight: 800; margin-bottom: 3px }
.feat-d { font-size: 14.5px; color: var(--ink-2); line-height: 1.45 }

/* ── BUTTONS ─────────────────────────────────────────────── */
.btn {
  font: inherit; font-size: 16px; font-weight: 800; cursor: pointer;
  min-height: var(--tap); padding: 13px 22px;
  border: 1.5px solid var(--line-2); background: var(--surface);
  color: var(--ink); border-radius: var(--r-sm);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  text-decoration: none; text-align: center;
}
.btn:hover { background: var(--surface-2) }
.btn-go {
  background: var(--teal); border-color: var(--teal); color: #fff;
  box-shadow: 0 3px 12px rgba(13,125,118,.22);
}
.btn-go:hover { background: var(--teal-dk); border-color: var(--teal-dk) }
.btn-big { width: 100%; font-size: 17.5px; min-height: 58px; margin-top: 8px; border-radius: var(--r) }
.btn-sub {
  width: 100%; margin-top: 10px; font-size: 15px; font-weight: 700;
  background: transparent; border-color: var(--line); color: var(--ink-2);
}
.btns { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px }
.btns .btn { flex: 1 1 auto; min-width: 155px }
.btn-add {
  width: 100%; margin-top: 12px; font-size: 15px;
  border-style: dashed; background: var(--teal-pale);
  border-color: var(--teal); color: var(--teal-dk);
}

/* ── ENTRY GATE (modal) ──────────────────────────────────── */
.modal-back {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(16,34,31,.45); backdrop-filter: blur(3px);
  display: grid; place-items: center; padding: 18px; overflow-y: auto;
}
.modal {
  background: var(--surface); border-radius: var(--r-xl);
  border-top: 5px solid var(--amber);
  max-width: 540px; width: 100%; padding: 26px 24px;
  box-shadow: var(--shadow-lg); margin: auto;
}
.badge {
  display: inline-block; background: var(--amber); color: #2b1c00;
  font-size: 12px; font-weight: 800; letter-spacing: .06em;
  text-transform: uppercase; padding: 9px 15px; border-radius: 999px;
  margin-bottom: 16px; line-height: 1.3;
}
.modal h2 { font-size: 25px; font-weight: 800; letter-spacing: -.025em; margin-bottom: 4px }
.modal .by { color: var(--teal); font-weight: 800; font-size: 15px; margin-bottom: 16px }
.modal p { font-size: 15.5px; color: var(--ink-2); margin-bottom: 13px; line-height: 1.5 }
.modal p strong, .modal p b { color: var(--ink) }
.btn-dark {
  width: 100%; background: #14312e; color: #fff; border: 0;
  font: inherit; font-size: 16.5px; font-weight: 800; min-height: 58px;
  border-radius: var(--r); cursor: pointer; margin-top: 8px;
  padding: 14px 20px; line-height: 1.3;
}
.btn-dark:hover { background: #0c211f }

/* ── SECTION ─────────────────────────────────────────────── */
.sec {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 22px;
}
.sec-top { display: flex; gap: 14px; align-items: center; margin-bottom: 12px }
.sec-ic {
  flex: none; width: 48px; height: 48px; border-radius: 14px;
  background: var(--teal-pale); display: grid; place-items: center; font-size: 25px;
}
.sec-n { font-size: 11.5px; font-weight: 800; color: var(--teal);
         text-transform: uppercase; letter-spacing: .09em }
.sec-top h2 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; line-height: 1.22 }
.sec-lead {
  font-size: 15.5px; color: var(--ink-2); background: var(--teal-pale);
  border-radius: var(--r); padding: 14px 16px; margin-bottom: 20px;
}
.sec-nav {
  display: flex; gap: 12px; justify-content: space-between; align-items: center;
  margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line);
}
.sec-nav .btn { flex: 1 }
.sec-nav .btn-go { flex: 2 }

/* ── QUESTIONS ───────────────────────────────────────────── */
.q { padding: 20px 0; border-bottom: 1px solid var(--line) }
.q:last-of-type { border-bottom: 0 }
.q-label { display: block; font-size: 17.5px; font-weight: 700; margin-bottom: 5px; line-height: 1.38 }
.q-key { color: var(--teal); font-size: 20px; vertical-align: middle }
.q-hint { font-size: 14.5px; color: var(--ink-3); margin-bottom: 11px; line-height: 1.45 }
.q-multi { font-size: 13px; font-weight: 700; color: var(--ink-3); margin-bottom: 8px }
.q-in { margin-top: 11px }

.q-flag { font-size: 14.5px; font-weight: 700; margin-top: 11px; padding: 11px 14px; border-radius: var(--r-sm) }
.q-flag.is-amber { background: var(--amber-lt); color: var(--amber-ink); border-left: 4px solid var(--amber) }
.q-flag.is-red { background: var(--red-lt); color: var(--red-ink); border-left: 4px solid var(--red) }
.q-bad { font-size: 14.5px; font-weight: 700; color: var(--red); margin-top: 8px }
.q-good { font-size: 14.5px; font-weight: 700; color: var(--ok); margin-top: 8px }

/* 16px floor: below that, iOS Safari zooms the page on focus and
   the patient loses the form. */
.in {
  font: inherit; font-size: 17px; width: 100%;
  min-height: var(--tap); padding: 12px 14px;
  border: 1.5px solid var(--line-2); border-radius: var(--r-sm);
  background: var(--surface); color: var(--ink);
}
.in:focus { border-color: var(--teal) }
.in-area { line-height: 1.5; resize: vertical; min-height: 96px }
.in-row { display: flex; align-items: stretch; gap: 9px }
.in-num { max-width: 170px; text-align: right; font-variant-numeric: tabular-nums }
.in-unit { display: flex; align-items: center; font-size: 14px; font-weight: 700;
           color: var(--ink-3); white-space: nowrap }
select.in {
  appearance: none;
  background-image:
    linear-gradient(45deg, transparent 50%, var(--ink-2) 50%),
    linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
  background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%;
  background-size: 6px 6px, 6px 6px; background-repeat: no-repeat;
  padding-right: 38px;
}

/* Answers as full-width cards: the whole row is the target. */
.opts { display: flex; flex-direction: column; gap: 10px }
.opt {
  display: flex; align-items: flex-start; gap: 13px;
  min-height: var(--tap); padding: 14px 16px;
  border: 1.5px solid var(--line); border-radius: var(--r);
  background: var(--surface); cursor: pointer;
  font: inherit; font-size: 16px; text-align: left; width: 100%; color: var(--ink);
}
.opt:hover { background: var(--teal-pale); border-color: var(--line-2) }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px }
.opt-mark {
  flex: none; width: 24px; height: 24px; margin-top: 1px;
  border: 2.5px solid #a9bcb8; border-radius: 50%;
  background: var(--surface); position: relative;
}
.opt-mark.is-box { border-radius: 7px }
.opt-txt { flex: 1; line-height: 1.4 }
.opt.on { border-color: var(--teal); background: var(--teal-lt); font-weight: 700 }
.opt.on .opt-mark { border-color: var(--teal); background: var(--teal) }
.opt.on .opt-mark::after {
  content: ''; position: absolute; inset: 0; margin: auto;
  width: 9px; height: 9px; background: #fff; border-radius: 50%;
}
.opt.on .opt-mark.is-box::after {
  width: 11px; height: 6px; background: transparent;
  border: 0 solid #fff; border-left-width: 3px; border-bottom-width: 3px;
  border-radius: 1px; transform: rotate(-45deg) translateY(-2px);
}
.opt:focus-within { outline: 3px solid var(--teal); outline-offset: 2px }

/* Lettered badge, for the quiz */
.opt-letter {
  flex: none; width: 28px; height: 28px; border-radius: 50%;
  background: var(--surface-2); border: 1px solid var(--line);
  display: grid; place-items: center; margin-top: -1px;
  font-size: 13px; font-weight: 800; color: var(--ink-2);
}

/* 0-10 readiness scale */
.scale { display: flex; gap: 5px; flex-wrap: wrap }
.sc {
  font: inherit; font-size: 16px; font-weight: 800; cursor: pointer;
  flex: 1 1 auto; min-width: var(--tap); min-height: var(--tap);
  border: 1.5px solid var(--line); border-radius: var(--r-sm);
  background: var(--surface); color: var(--ink-2);
}
.sc.on { background: var(--teal); border-color: var(--teal); color: #fff }
.scale-ends { display: flex; justify-content: space-between;
              font-size: 12.5px; font-weight: 700; color: var(--ink-3); margin-top: 7px }

/* Computed read-outs */
.calc {
  font-size: 17px; font-weight: 700; padding: 14px 16px;
  border-radius: var(--r); border-left: 5px solid var(--line-2);
  background: var(--surface-2); margin-top: 6px;
}
.calc b { font-size: 25px; font-variant-numeric: tabular-nums }
.calc small { font-size: 13px; font-weight: 600; color: var(--ink-2) }
.calc.is-ok   { background: var(--ok-lt);    border-left-color: var(--ok);    color: #0a5c2e }
.calc.is-warn { background: var(--amber-lt); border-left-color: var(--amber); color: var(--amber-ink) }
.calc.is-bad  { background: var(--red-lt);   border-left-color: var(--red);   color: var(--red-ink) }
.calc.is-wait { color: var(--ink-3); font-weight: 600; font-size: 15px }
.calc-note { font-size: 14.5px; color: var(--ink-2); margin-top: 9px }

/* ── LOGBOOK ─────────────────────────────────────────────── */
.log { margin-top: 8px }
.log-head {
  display: grid; grid-template-columns: 1.1fr .8fr 1.3fr 46px; gap: 8px;
  font-size: 11px; font-weight: 800; color: var(--ink-3);
  text-transform: uppercase; letter-spacing: .06em; padding: 0 2px 7px;
}
.log-row {
  display: grid; grid-template-columns: 1.1fr .8fr 1.3fr 46px; gap: 8px;
  align-items: center; padding: 8px; border-radius: var(--r-sm);
  border-left: 4px solid transparent;
}
.log-row .in { font-size: 16px; min-height: 46px; padding: 9px 11px }
.log-row.b-in   { border-left-color: var(--glu-in);  background: var(--ok-lt) }
.log-row.b-high { border-left-color: var(--glu-hi);  background: var(--amber-lt) }
.log-row.b-low1 { border-left-color: var(--glu-lo1); background: var(--red-lt) }
.log-row.b-low2 { border-left-color: var(--glu-lo2); background: #fbdcd8 }
.log-row2 {
  display: grid; grid-template-columns: 1fr 120px auto; gap: 10px;
  align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line);
}
.log-lab { font-size: 15px; font-weight: 700; color: var(--ink-2) }
.log-empty { font-size: 14.5px; color: var(--ink-3); padding: 14px 2px; line-height: 1.5 }
.x {
  font: inherit; font-size: 22px; line-height: 1; cursor: pointer;
  width: 46px; height: 46px; border: 1.5px solid var(--line);
  border-radius: var(--r-sm); background: var(--surface); color: var(--ink-3);
}
.x:hover { background: var(--red-lt); border-color: var(--red); color: var(--red) }

.stats { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px }
.stat {
  flex: 1 1 112px; background: var(--surface-2);
  border: 1px solid var(--line); border-radius: var(--r-sm); padding: 11px 13px;
}
.stat-k { display: block; font-size: 10.5px; font-weight: 800; color: var(--ink-3);
          text-transform: uppercase; letter-spacing: .05em }
.stat-v { display: block; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums }

/* ── CHARTS ──────────────────────────────────────────────── */
.chart { width: 100%; height: auto; margin-top: 16px; display: block }
.c-band { fill: var(--ok-lt); stroke: #9ad3b0; stroke-width: 1 }
.c-hypo { stroke: var(--glu-lo1); stroke-width: 1.5; stroke-dasharray: 5 4 }
.c-grid { stroke: var(--line); stroke-width: 1 }
.c-line { fill: none; stroke: #56706b; stroke-width: 2; stroke-linejoin: round }
.c-dot  { stroke: #fff; stroke-width: 1.5 }
.c-dot.d-in   { fill: var(--glu-in) }
.c-dot.d-high { fill: var(--glu-hi) }
.c-dot.d-low1 { fill: var(--glu-lo1) }
.c-dot.d-low2 { fill: var(--glu-lo2) }
.c-ytick, .c-xtick { font-size: 13px; font-weight: 700; fill: var(--ink-3); text-anchor: end }
.c-xtick { text-anchor: middle }
.c-xlab { font-size: 12px; font-weight: 700; fill: var(--ink-3); text-anchor: middle }
.c-note { font-size: 12px; font-weight: 600; fill: var(--ink-3) }
.c-bar.b-ok  { fill: var(--ok) }
.c-bar.b-mid { fill: var(--amber) }
.c-bar.b-low { fill: #a9bcb8 }

/* ── RED-FLAG BANNER ─────────────────────────────────────── */
.alert {
  max-width: var(--wrap); margin: 12px auto 0;
  background: var(--red); color: #fff; border-radius: var(--r-lg);
  box-shadow: 0 10px 30px rgba(179,38,38,.26);
}
.alert-in { padding: 20px }
.alert-h { font-size: 19px; font-weight: 800; margin-bottom: 8px; line-height: 1.3 }
.alert p { color: rgba(255,255,255,.95); margin-bottom: 10px }
.alert ul { list-style: none; margin: 12px 0 }
.alert li {
  font-size: 15px; font-weight: 700; padding: 9px 0 9px 20px;
  position: relative; border-top: 1px solid rgba(255,255,255,.28);
}
.alert li::before { content: '\203a'; position: absolute; left: 5px; font-size: 19px }
.alert-ed { font-size: 15.5px; font-weight: 700 }
.alert-ed b { font-size: 21px }
.btn-ack {
  background: #fff; border-color: #fff; color: var(--red);
  width: 100%; margin-top: 8px;
}

/* ── NURSING ─────────────────────────────────────────────── */
.card-gate { max-width: 480px; margin: 28px auto }
.gate-bad { color: var(--red); font-weight: 800; font-size: 15px; margin-top: 8px }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 13px; margin-bottom: 15px }
.nf { display: flex; flex-direction: column; gap: 6px }
.nf > span { font-size: 13px; font-weight: 800; color: var(--ink-2) }
.flaglist { list-style: none; margin: 10px 0 }
.flaglist li {
  font-size: 15px; font-weight: 700; padding: 12px 15px; margin-bottom: 8px;
  border-radius: var(--r-sm); border-left: 5px solid var(--line-2);
}
.flaglist li.is-red   { background: var(--red-lt);   border-left-color: var(--red);   color: var(--red-ink) }
.flaglist li.is-amber { background: var(--amber-lt); border-left-color: var(--amber); color: var(--amber-ink) }

.card-qr .qrwrap { display: flex; gap: 20px; align-items: center; flex-wrap: wrap }
.qr { flex: none; width: 154px }
.qr svg { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: var(--r-sm) }
.qr-url { font-size: 13px; color: var(--ink-2); word-break: break-all }
.qr-cap { font-size: 15.5px; font-weight: 800; color: var(--teal-dk) }

/* ── GUIDELINE TAB ───────────────────────────────────────── */
.steps { list-style: none; margin: 16px 0; counter-reset: s }
.steps li {
  display: flex; gap: 13px; align-items: flex-start;
  padding: 11px 0; font-size: 15px; color: var(--ink-2); line-height: 1.45;
}
.steps li::before {
  counter-increment: s; content: counter(s);
  flex: none; width: 26px; height: 26px; border-radius: 50%;
  background: var(--teal-pale); color: var(--teal-dk);
  display: grid; place-items: center; font-size: 13px; font-weight: 800;
}
.asks { display: flex; flex-wrap: wrap; gap: 9px }
.ask {
  font: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer;
  text-align: left; min-height: 44px; padding: 11px 16px;
  border: 1px solid var(--teal-lt); border-radius: 999px;
  background: var(--teal-lt); color: var(--teal-dk);
}
.ask:hover { background: #c9e6e1; border-color: var(--teal) }
ul.refs { list-style: none; display: flex; flex-wrap: wrap; gap: 9px }
ul.refs li { margin: 0 }
ul.refs a {
  display: inline-block; font-size: 13.5px; font-weight: 700;
  color: var(--teal-dk); text-decoration: none;
  border: 1px solid var(--line); border-radius: 999px;
  padding: 9px 15px; background: var(--surface); line-height: 1.35;
}
ul.refs a:hover { border-color: var(--teal); background: var(--teal-pale) }

/* ── QUIZ ────────────────────────────────────────────────── */
.card-quiz { border-top: 5px solid var(--amber) }
.qz-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px }
.qz-track { flex: 1; height: 6px; background: var(--line); border-radius: 999px; overflow: hidden }
.qz-fill { height: 100%; background: var(--teal); border-radius: 999px; transition: width .3s }
.qz-n { font-size: 13px; font-weight: 800; color: var(--ink-3); white-space: nowrap }
.qz-q { font-size: 21px; font-weight: 800; line-height: 1.32; letter-spacing: -.02em; margin: 2px 0 18px }
.opt.qz-done { cursor: default }
.opt.qz-right { border-color: var(--ok); background: var(--ok-lt); font-weight: 800 }
.opt.qz-right .opt-letter { background: var(--ok); border-color: var(--ok); color: #fff }
.opt.qz-wrong { border-color: var(--red); background: var(--red-lt) }
.opt.qz-wrong .opt-letter { background: var(--red); border-color: var(--red); color: #fff }
.qz-why {
  margin-top: 18px; padding: 16px 18px; border-radius: var(--r);
  border-left: 5px solid var(--line-2); background: var(--surface-2);
}
.qz-why.is-ok { background: var(--ok-lt); border-left-color: var(--ok) }
.qz-why.is-no { background: var(--amber-lt); border-left-color: var(--amber) }
.qz-verdict { font-size: 17px; font-weight: 800; margin-bottom: 8px; color: var(--ink) }
.qz-why p { color: var(--ink-2) }
.qz-src { font-size: 12.5px; font-weight: 700; color: var(--ink-3); margin-bottom: 0 }
.card-quiz .btn-go { width: 100%; margin-top: 16px }

/* ── DONE / SUMMARY ──────────────────────────────────────── */
.card-done { text-align: center }
.card-done .tick {
  width: 70px; height: 70px; margin: 4px auto 16px;
  border-radius: 50%; background: var(--ok-lt); color: var(--ok);
  font-size: 38px; font-weight: 800; line-height: 70px;
}
.card-done ul.plain, .card-done .opt, .card-done .feat { text-align: left }

.note {
  font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  font-size: 12px; line-height: 1.45; white-space: pre; overflow-x: auto;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 16px; color: var(--ink);
  -webkit-overflow-scrolling: touch;
}

/* ── NATIONAL PICTURE DASHBOARD ──────────────────────────
   Laid out like the Family Cancer Risk Check registry panel:
   three stat tiles, then ranked horizontal bars under small grey
   uppercase subheads. Bars are divs rather than SVG — a bar chart
   is a list with a length, and as HTML it reflows on a phone,
   reads to a screen reader as a list, and needs no viewBox. */
.subhead {
  font-size: 12px; font-weight: 800; color: var(--ink-3);
  text-transform: uppercase; letter-spacing: .07em;
  margin: 26px 0 14px;
}
.subhead:first-of-type { margin-top: 18px }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px }
.tile {
  background: var(--teal-pale); border: 1px solid #cfe5e1;
  border-radius: var(--r); padding: 16px 18px;
}
.tile.is-amber { background: #fdf0db; border-color: #f0d6a8 }
.tile-big {
  font-size: 34px; font-weight: 800; letter-spacing: -.035em;
  line-height: 1.05; color: var(--teal-dk); margin-bottom: 7px;
}
.tile.is-amber .tile-big { color: #b07000 }
.tile-cap { font-size: 14px; color: var(--ink-2); line-height: 1.42 }

.barset { display: flex; flex-direction: column; gap: 3px }
.bar-row {
  display: grid; grid-template-columns: minmax(96px, 1.25fr) 2fr auto;
  gap: 12px; align-items: center; padding: 7px 0;
}
.bar-l { font-size: 14.5px; font-weight: 600; line-height: 1.3 }
.bar-l small { display: block; font-size: 12.5px; color: var(--ink-3); font-weight: 500; margin-top: 2px }
.bar-track { height: 15px; background: #e1eae8; border-radius: 999px; overflow: hidden }
.bar-fill { height: 100%; border-radius: 999px; background: var(--teal); min-width: 5px }
.bar-fill.f-amber { background: var(--amber) }
.bar-fill.f-red   { background: #c0392b }
.bar-fill.f-slate { background: #7d918d }
.bar-v {
  font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums;
  text-align: right; min-width: 52px;
}

/* Year-on-year series: a compact row of labelled columns. */
.trend { display: flex; gap: 10px; align-items: flex-end; margin-top: 12px }
.trend-col { flex: 1; text-align: center }
.trend-bar {
  background: linear-gradient(180deg, var(--teal), var(--teal-dk));
  border-radius: 8px 8px 0 0; margin: 0 auto; width: 100%;
}
.trend-col.is-amber .trend-bar { background: linear-gradient(180deg, #f0ab2e, #c57f00) }
.trend-v { font-size: 15px; font-weight: 800; margin-bottom: 5px; font-variant-numeric: tabular-nums }
.trend-y { font-size: 12.5px; font-weight: 700; color: var(--ink-3); margin-top: 7px }

.dash-lead { font-size: 15.5px; color: var(--ink-2); line-height: 1.5; margin-bottom: 4px }
.srcline { font-size: 12.5px; color: var(--ink-3); margin-top: 18px; line-height: 1.5 }
.srcline a { color: var(--teal-dk); font-weight: 700 }

@media (max-width: 430px) {
  .bar-row { grid-template-columns: 1fr auto; grid-template-areas: 'l v' 't t'; gap: 5px 10px }
  .bar-l { grid-area: l } .bar-v { grid-area: v } .bar-track { grid-area: t; margin-bottom: 4px }
  .tile-big { font-size: 29px }
}

/* ── FOOTER ──────────────────────────────────────────────── */
.foot {
  max-width: var(--wrap); margin: 0 auto;
  padding: 24px 16px 48px; font-size: 13px; color: var(--ink-3);
  border-top: 1px solid var(--line);
}
.foot p { margin-bottom: 8px; line-height: 1.5 }
.foot b { color: var(--ink-2) }

/* ── NARROW PHONES ───────────────────────────────────────── */
@media (max-width: 430px) {
  body { font-size: 16px }
  .wrap { padding-left: 13px; padding-right: 13px }
  .card, .sec { padding: 17px; border-radius: 18px }
  .hero { padding: 22px 19px; border-radius: 20px }
  .hero h2 { font-size: 25px }
  .sec-top h2, .card h2 { font-size: 20px }
  .qz-q { font-size: 19px }
  .tab-h { display: none }
  .log-head { display: none }
  /* One block per reading, rather than three inputs squeezed into
     300px of grid. */
  .log-row {
    grid-template-columns: 1fr 46px;
    grid-template-areas: 'd x' 'v x' 'c x';
    gap: 7px; padding: 11px; margin-bottom: 10px;
    border: 1px solid var(--line); border-left-width: 4px;
  }
  .log-row > *:nth-child(1) { grid-area: d }
  .log-row > *:nth-child(2) { grid-area: v }
  .log-row > *:nth-child(3) { grid-area: c }
  .log-row > .x { grid-area: x; align-self: start }
  .in-num { max-width: none }
  .qr { width: 130px }
  .modal { padding: 21px 18px }
  .modal h2 { font-size: 22px }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important }
}

/* ── PRINT ───────────────────────────────────────────────────
   Two print paths, each selected by a class added just before
   window.print(). Without one, nothing useful prints — a patient
   hitting Ctrl+P on the questionnaire should not get forty pages
   of form controls.
   ─────────────────────────────────────────────────────────── */
.print-only { display: none }

@media print {
  @page { size: A4; margin: 14mm }
  body { background: #fff !important; font-size: 11pt }
  .hdr, .tabs, #progress, .foot, .btn, .btns, .sec-nav,
  .alert .btn-ack, .asks, .sos-wrap, .modal-back { display: none !important }
  .card, .sec { box-shadow: none; border: 1px solid #ccc; break-inside: avoid }
  .print-only { display: block }

  body.print-note .wrap > .card:not(:last-child) { display: none }
  body.print-note .note {
    font-size: 9.5pt; line-height: 1.35; white-space: pre-wrap;
    border: 0; background: #fff; padding: 0;
  }
  body.print-note .card { border: 0; padding: 0 }

  body.print-qr .wrap > .card:not(.card-qr) { display: none }
  body.print-qr .card-qr { border: 0; text-align: center }
  body.print-qr .qrwrap { justify-content: center; display: block }
  body.print-qr .qr { width: 95mm; margin: 0 auto 8mm }
  body.print-qr .qr-cap { font-size: 20pt }
  body.print-qr .qr-url { font-size: 10pt }
}
</style>

<script>
/* Deployment configuration. These are the only values a clinic
   should need to change, and they are set here rather than buried
   in the application so that changing them needs no knowledge of

   nurseCode is a SPEED BUMP, NOT SECURITY. The whole application

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],
      [6, 30, 54],
      [6, 32, 58],
      [6, 34, 62],
      [6, 26, 46, 66],
      [6, 26, 48, 70],
      [6, 26, 50, 74],
      [6, 30, 54, 78],
      [6, 30, 56, 82],
      [6, 30, 58, 86],
      [6, 34, 62, 90],
      [6, 28, 50, 72, 94],
      [6, 26, 50, 74, 98],
      [6, 30, 54, 78, 102],

<script>
/* ============================================================
   PRA-KONSULTASI DIABETIK — CLINICAL CONSTANTS
   Klinik Diabetik, Hospital Tengku Permaisuri Norashikin, Kajang

   THIS FILE IS THE ONLY PLACE A CLINICAL NUMBER IS WRITTEN.

   Every threshold the application uses -- to colour a reading, to
   raise a flag, to classify a BMI, to decide that a screening test
   is overdue -- is declared here with the guideline clause it comes
   from. Nothing downstream invents a number: app.js, schema.js,
   summary.js and quiz.js all read CPG.*. A clinician auditing this
   application reads this one file, not six.

   SOURCES, and only these two:
     [T2DM] Clinical Practice Guidelines: Management of Type 2
            Diabetes Mellitus, 6th Edition. Ministry of Health
            Malaysia / Academy of Medicine Malaysia / Malaysian
            Endocrine & Metabolic Society / Diabetes Malaysia /
            FMSA Malaysia. December 2020.
            MOH/P/PAK/447.20(GU)-e.
     [OBES] Clinical Practice Guidelines: Management of Obesity,
            2nd Edition. Ministry of Health Malaysia / MEMS /
            FMSA / Malaysian Dietitians' Association / MASO. 2023.
            ISBN 978-967-2887-53-9.

   ── VERIFICATION STATUS ──────────────────────────────────────
   The `v` field on each entry records whether the value has been
   checked against the published PDF by a human:

     v: 'cpg'    checked against the document, clause cited
     v: 'verify' TRANSCRIBED FROM THE GUIDELINE BUT NOT YET
                 RE-CHECKED AGAINST THE PDF IN THIS REPOSITORY

   Entries marked 'verify' must be read against the source PDF
   before this application is used in a live clinic. The build
   prints a count of them and the Summary tab carries a visible
   notice for as long as any remain, so an unverified number
   cannot quietly reach a doctor's note. Correct a value here and
   it corrects everywhere; change `v` to 'cpg' as each is signed
   off, and add the page number to `cl`.
   ============================================================ */

/* L(ms, en) — every string in this application carries both
   languages at the point it is written, so a Malay label and its
   English twin cannot drift into different files. */
function L(ms, en) { return { ms: ms, en: en || ms }; }

var CPG = {

  /* The documents themselves, cited in full on the summary and in
     the guideline tab. Nothing in this app may cite anything else. */
  refs: {
    t2dm: {
      short: 'CPG T2DM 6th Ed. (2020)',
      full: L(
        'Garis Panduan Amalan Klinikal: Pengurusan Diabetes Mellitus Jenis 2, Edisi ke-6, Kementerian Kesihatan Malaysia, Disember 2020. MOH/P/PAK/447.20(GU)-e.',
        'Clinical Practice Guidelines: Management of Type 2 Diabetes Mellitus, 6th Edition, Ministry of Health Malaysia, December 2020. MOH/P/PAK/447.20(GU)-e.'),
      url: 'https://mems.my/wp-content/uploads/2021/03/CPG-T2DM_6th-Edition-2020_210226.pdf'
    },
    obes: {
      short: 'CPG Obesity 2nd Ed. (2023)',
      full: L(
        'Garis Panduan Amalan Klinikal: Pengurusan Obesiti, Edisi ke-2, Kementerian Kesihatan Malaysia, 2023. ISBN 978-967-2887-53-9.',
        'Clinical Practice Guidelines: Management of Obesity, 2nd Edition, Ministry of Health Malaysia, 2023. ISBN 978-967-2887-53-9.'),
      url: 'https://mems.my/wp-content/uploads/2023/06/230518_MEMS_CPG-Management-Obesity_FA8-Digital.pdf'
    }
  },

  /* ── Glycaemic targets ─────────────────────────────────────
     [T2DM] targets for control. The guideline sets a general
     HbA1c target and then individualises it; the app never
     applies a target to a patient on its own, it reports the
     reading beside the band and leaves the choice of band to the
     doctor. That is deliberate: picking the band is a clinical
     judgement about hypoglycaemia risk, comorbidity and life
     expectancy that a waiting-room form cannot make. */
  hba1c: {
    general:  { pct: 6.5, v: 'verify', cl: '[T2DM] targets for control',
                note: L('Sasaran am', 'General target') },
    tight:    { pct: 6.1, v: 'verify', cl: '[T2DM] individualisation of targets',
                note: L('Baru didiagnos, muda, tiada penyakit jantung',
                        'Newly diagnosed, younger, no cardiovascular disease') },
    relaxed:  { pct: 7.0, v: 'verify', cl: '[T2DM] individualisation of targets',
                note: L('Ada komorbiditi, risiko hipoglisemia',
                        'Comorbidity present, hypoglycaemia risk') },
    frail:    { pct: 8.0, v: 'verify', cl: '[T2DM] individualisation of targets',
                note: L('Komorbiditi berat, jangka hayat terhad, hipoglisemia teruk',

    post:    { lo: 4.4, hi: 8.5, v: 'verify', cl: '[T2DM] targets for control',

          desc: L('Glukosa kurang 3.9 mmol/L dan 3.0 mmol/L atau lebih.',

     THIS IS THE SINGLE MOST IMPORTANT ENTRY TO VERIFY: the

  bp: { sys: 135, dia: 75, v: 'verify', cl: '[T2DM] blood pressure target' },

  bmi: {

    bands: [
      { max: 18.49, key: 'under',  name: L('Kurang berat', 'Underweight') },

    obeseFrom: 27.5

  weightLoss: { minPct: 5, goodPct: 10, v: 'verify',

  energyDeficit: { lo: 500, hi: 750, v: 'verify',

  activity: {

  steps: {

  screening: {

/* Count of entries still awaiting a signature against the PDF.
   app.js renders a notice while this is above zero; build/web.js
   prints it so it cannot be forgotten. */
CPG.unverified = (function () {
  var n = 0;
  (function walk(o) {
    if (!o || typeof o !== 'object') return;
    if (o.v === 'verify') n++;
    for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) walk(o[k]);
  })(CPG);
  return n;
})();

/* ── Derived helpers ─────────────────────────────────────────
   Shared by the questionnaire, the nursing tab and the summary so
   a BMI band is computed once and identically everywhere. */
var CPGcalc = {

  bmi: function (kg, cm) {
    kg = parseFloat(kg); cm = parseFloat(cm);
    if (!(kg > 0) || !(cm > 0)) return null;
    var m = cm / 100;
    return Math.round((kg / (m * m)) * 10) / 10;
  },

  bmiBand: function (bmi) {
    if (bmi == null || isNaN(bmi)) return null;
    for (var i = 0; i < CPG.bmi.bands.length; i++) {
      if (bmi <= CPG.bmi.bands[i].max) return CPG.bmi.bands[i];
    }
    /* Unreachable while the top band is open-ended, and kept so
       that closing it later cannot start returning null to callers
       that reasonably assume a number always lands in a band. */
    return CPG.bmi.bands[CPG.bmi.bands.length - 1];
  },

  /* A BMI outside this range is a mistyped weight or height, not a
     person. Saying so is more use to a patient than solemnly
     classifying the typo. */
  bmiPlausible: function (bmi) { return bmi != null && bmi >= 10 && bmi <= 100; },

  /* Waist above the Asian cut-off for the recorded sex. Returns
     null when either is unknown rather than guessing a cut-off. */
  waistHigh: function (cm, sex) {
    cm = parseFloat(cm);
    if (!(cm > 0) || !sex) return null;
    var cut = sex === 'F' ? CPG.waist.female : CPG.waist.male;
    return { high: cm >= cut, cut: cut };
  },

  /* Classify one capillary reading against the band for its
     context. Returns 'low2' | 'low1' | 'in' | 'high'. */
  glucoseBand: function (mmol, context) {
    var v = parseFloat(mmol);
    if (!(v > 0)) return null;
    if (v < CPG.hypo.l2.lt) return 'low2';
    if (v < CPG.hypo.l1.lt) return 'low1';
    var band = (context === 'post2h') ? CPG.cap.post : CPG.cap.fasting;
    if (v > band.hi) return 'high';
    return 'in';
  },

  /* Months between an ISO-ish month string (YYYY-MM) and now.
     Returns null for blank or unparseable input, which the
     summary reports as "not known" rather than as overdue. */
  monthsSince: function (ym) {
    if (!ym) return null;
    var m = /^(\d{4})-(\d{1,2})/.exec(String(ym));
    if (!m) return null;
    var then = new Date(+m[1], +m[2] - 1, 1), now = new Date();
    if (isNaN(then.getTime())) return null;
    var d = (now.getFullYear() - then.getFullYear()) * 12 + (now.getMonth() - then.getMonth());
    return d < 0 ? null : d;
  },

  /* Weight to lose for the guideline's 5% and 10% milestones. */
  weightTargets: function (kg) {
    kg = parseFloat(kg);
    if (!(kg > 0)) return null;
    var r = function (x) { return Math.round(x * 10) / 10; };
    return {
      now: r(kg),
      min: { pct: CPG.weightLoss.minPct, lose: r(kg * CPG.weightLoss.minPct / 100),
             to: r(kg * (1 - CPG.weightLoss.minPct / 100)) },
      good: { pct: CPG.weightLoss.goodPct, lose: r(kg * CPG.weightLoss.goodPct / 100),
              to: r(kg * (1 - CPG.weightLoss.goodPct / 100)) }
    };
  },

  /* Malaysian NRIC. Derives date of birth, age and sex -- three
     fields the patient then does not have to type, and three
     fewer chances to mistype them. Place-of-birth is deliberately
     not decoded: the code list has changed over time and a wrong
     state of birth on a clinical note is worse than a blank.

     Returns { ok, dob, age, sex, why } -- `why` names the failure
     so the field can say what is wrong rather than just reject. */
  ic: function (raw) {
    var s = String(raw || '').replace(/\D/g, '');
    if (!s) return { ok: false, why: 'empty' };
    if (s.length !== 12) return { ok: false, why: 'length' };
    var yy = +s.slice(0, 2), mm = +s.slice(2, 4), dd = +s.slice(4, 6);
    if (mm < 1 || mm > 12 || dd < 1 || dd > 31) return { ok: false, why: 'date' };

    /* Two-digit years: assume this century until that would put
       the birth in the future, then fall back a hundred years. */
    var now = new Date(), cy = now.getFullYear();
    var year = 2000 + yy;
    if (year > cy) year = 1900 + yy;
    var dob = new Date(year, mm - 1, dd);
    if (dob.getFullYear() !== year || dob.getMonth() !== mm - 1 || dob.getDate() !== dd) {
      return { ok: false, why: 'date' };
    }
    var age = cy - year;
    var md = (now.getMonth() + 1) * 100 + now.getDate();
    if (md < mm * 100 + dd) age--;
    if (age < 0 || age > 120) return { ok: false, why: 'age' };

    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    return {
      ok: true,
      dob: year + '-' + pad(mm) + '-' + pad(dd),
      age: age,
      sex: (+s.slice(11, 12) % 2) ? 'M' : 'F'
    };
  }
};
</script>

<script>
/* ============================================================
   PRA-KONSULTASI DIABETIK — QUESTION SCHEMA

   The questionnaire is data, not markup. Every question is one
   object here, carrying its own wording in both languages, its
   options, the condition under which it is asked, and the rule
   that decides whether an answer should raise a flag. app.js
   renders this; summary.js reads it. Adding a question means
   adding one object and nothing else.

   FIELD SHAPE
     id     unique key; also the storage key and the summary key
     type   render and validation behaviour (see app.js renderers)
     q      the question, L(ms, en)
     hint   small print under the question
     opts   [{ v, l }] for radio / checks / select
     unit   printed after a number box
     min    numeric floor, used for validation only
     max    numeric ceiling
     when   fn(S) -> show this question for this patient
     flag   fn(value, S) -> { lvl:'red'|'amber', ms, en } or null
     sum    how the summary labels it; defaults to `q`
     key    a question the summary really wants an answer to; the
            form nudges once but never blocks, because the consent
            text promises that every question may be skipped and a
            form that breaks that promise is worse than a blank

   CLINICAL DESIGN NOTES
     - Red flags are deliberately over-inclusive. The cost of a
       false alarm here is a nurse spending a minute; the cost of
       a miss is a patient sitting in a waiting room with an acute
       coronary syndrome. Every red flag is phrased as "tell the
       staff", never as a diagnosis.
     - Drugs are asked by the names patients actually recognise,
       brand and generic together. Asking a patient which drug
       class they are on produces fiction. The hypoglycaemia
       section opens on insulin or a sulphonylurea, and also when
       the patient does not know what they take, because not
       knowing is not a reason to skip the hypo questions.
     - Screening intervals are asked as bands, not dates. A date
       a patient half-remembers is worse data than a band they
       are confident about.
     - Nothing here asks the patient to interpret anything. Every
       question is about what they did, felt, or were told.
   ============================================================ */

function opt(v, ms, en) { return { v: v, l: L(ms, en) }; }

var YN  = [opt('yes', 'Ya', 'Yes'), opt('no', 'Tidak', 'No')];
var YNU = [opt('yes', 'Ya', 'Yes'), opt('no', 'Tidak', 'No'),
           opt('dk', 'Tidak pasti', 'Not sure')];

/* How recently something was done. Shared by all five screening
   questions so the bands cannot drift apart between them. */
var RECENCY = [
  opt('lt6',   'Dalam 6 bulan lepas', 'Within the last 6 months'),
  opt('6to12', '6 hingga 12 bulan lepas', '6 to 12 months ago'),
  opt('1to2',  'Lebih setahun, kurang dua tahun', 'More than a year, less than two'),
  opt('gt2',   'Lebih dua tahun lepas', 'More than two years ago'),
  opt('never', 'Belum pernah', 'Never'),
  opt('dk',    'Saya tidak ingat', 'I do not remember')
];

/* How often, for dietary frequency questions. */
var FREQ = [
  opt('never', 'Tidak pernah', 'Never'),
  opt('rare',  'Sekali-sekala', 'Now and then'),
  opt('wk1',   '1 hingga 2 kali seminggu', '1 to 2 times a week'),
  opt('wk3',   '3 hingga 5 kali seminggu', '3 to 5 times a week'),
  opt('daily', 'Setiap hari', 'Every day'),
  opt('dailyPlus', 'Lebih sekali sehari', 'More than once a day')
];

/* Patient is on insulin, on a sulphonylurea, or does not know what
   they take. Any of the three opens the hypoglycaemia section. */
function onHypoRisk(S) {
  var d = S.drugs || [];
  return d.indexOf('insulin') >= 0 || d.indexOf('su') >= 0 ||
         d.indexOf('dk') >= 0 || S.inject === 'yes';
}
function onInsulin(S) { return (S.drugs || []).indexOf('insulin') >= 0 || S.inject === 'yes'; }

function isFemale(S) { return S.sex === 'F'; }

var SCHEMA = [

  /* ══ A. About you ═══════════════════════════════════════════ */
  {
    id: 'about',
    icon: '🪪',
    title: L('Tentang anda', 'About you'),
    lead: L('Supaya ringkasan ini sampai ke fail yang betul.',
            'So that this summary reaches the right file.'),
    fields: [
      { id: 'name', type: 'text', key: true,
        q: L('Nama penuh, seperti dalam kad pengenalan', 'Full name, as on your IC'),
        sum: L('Nama', 'Name') },

      { id: 'ic', type: 'ic', key: true,
        q: L('Nombor kad pengenalan', 'IC number'),
        hint: L('Tarikh lahir, umur dan jantina diambil daripada nombor ini, jadi anda tidak perlu menaipnya.',
                'Date of birth, age and sex are taken from this number, so you need not type them.'),
        sum: L('No. KP', 'IC number') },

      { id: 'mrn', type: 'text',
        q: L('Nombor rekod perubatan (RN), jika anda tahu', 'Medical record number (RN), if you know it'),
        hint: L('Tertulis pada kad klinik anda.', 'It is printed on your clinic card.'),
        sum: L('No. RN', 'RN') },

      { id: 'phone', type: 'tel',
        q: L('Nombor telefon', 'Telephone number'),
        sum: L('Telefon', 'Telephone') },

      { id: 'race', type: 'select',
        q: L('Bangsa', 'Race'),
        opts: [
          opt('melayu', 'Melayu', 'Malay'),
          opt('cina', 'Cina', 'Chinese'),
          opt('india', 'India', 'Indian'),
          opt('bumiSbh', 'Bumiputera Sabah', 'Bumiputera Sabah'),
          opt('bumiSwk', 'Bumiputera Sarawak', 'Bumiputera Sarawak'),
          opt('orangAsli', 'Orang Asli', 'Orang Asli'),
          opt('lain', 'Lain-lain', 'Other')
